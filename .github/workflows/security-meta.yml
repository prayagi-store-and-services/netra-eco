name: Site security metadata tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node tests/security-meta.test.js
      - run: node tests/site-hygiene.test.js
      - run: node tests/scroll-contract.test.js
      - run: node tests/release-fallback.test.js
      - run: node tests/app-links.test.js
      - run: node tests/slow-load.test.js
      - run: node tests/community.test.js
